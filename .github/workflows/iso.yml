# Kairo ISO: echte ISO bauen und in QEMU booten, komplett in der Cloud.
#
# Für alle, die lokal keine Arch-Umgebung mit genug Platz haben (z. B. ein
# Chromebook). Macht Teil B-D von docs/05-checkliste-kairo-0.1.md automatisch:
#
#   build      ISO im offiziellen Arch-Container mit scripts/build-iso.sh
#   boot-test  ISO in QEMU starten (UEFI und BIOS), Checkliste per
#              scripts/boot-test.py abarbeiten, Screenshots speichern
#
# Ergebnisse im Browser: Actions -> dieser Lauf -> "Summary". Dort stehen die
# Prüftabellen, unten die Artifacts (ISO, Screenshots, serial.log).
#
# Anders als ci.yml braucht dieser Workflow "docker --privileged": mkarchiso
# baut ein ganzes Dateisystem. Das passiert auf einer frischen, einmaligen
# GitHub-VM, nie auf deinem Rechner. Weiterhin keine Secrets, nur Lesezugriff.

name: ISO bauen und testen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'iso/**'
      - 'scripts/build-iso.sh'
      - 'scripts/assemble-iso-profile.sh'
      - 'scripts/boot-test.py'
      - '.github/workflows/iso.yml'

permissions:
  contents: read

jobs:
  build:
    name: ISO bauen (Arch-Container)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Platz schaffen (build-iso.sh verlangt 15 GiB frei)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Ubuntu 24.04 sperrt User-Namespaces für normale Programme per AppArmor.
      # mkarchiso als normaler Benutzer braucht sie (unshare --map-auto).
      - name: User-Namespaces erlauben
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: ISO bauen
        run: |
          docker run --rm --privileged -v "$PWD:/repo" -w /repo \
            -e HOST_IDS="$(id -u):$(id -g)" archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed archiso git python
              useradd -m builder
              # unshare --map-auto braucht Bereiche für Unter-UIDs/-GIDs
              grep -q "^builder:" /etc/subuid || echo "builder:100000:65536" >> /etc/subuid
              grep -q "^builder:" /etc/subgid || echo "builder:100000:65536" >> /etc/subgid
              # Im Docker-Image fehlen die Datei-Capabilities aus dem Paket
              # shadow ("newuidmap: Could not set caps"), also neu setzen
              setcap cap_setuid=ep /usr/bin/newuidmap
              setcap cap_setgid=ep /usr/bin/newgidmap
              chown -R builder /repo
              echo "::group::scripts/check-env.sh (RAM/KVM fehlen im Container, nur zur Info)"
              su builder -c "scripts/check-env.sh" || true
              echo "::endgroup::"
              pacman -Q archiso
              su builder -c "scripts/build-iso.sh"
              # Dateien zurück an den Runner-Benutzer, sonst darf der nächste
              # Schritt nicht in out/ schreiben
              chown -R "$HOST_IDS" /repo
            '

      - name: Prüfsumme
        run: |
          cd out
          ls -l
          sha256sum kairo-*-x86_64.iso | tee SHA256SUMS
          {
            echo "## ISO gebaut"
            echo '```'
            ls -l kairo-*-x86_64.iso
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: kairo-iso
          path: |
            out/kairo-*-x86_64.iso
            out/SHA256SUMS
          compression-level: 0  # ISO ist schon komprimiert
          retention-days: 14
          if-no-files-found: error

  boot-test:
    name: Boot-Test ${{ matrix.boot }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        boot: [uefi, bios]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: kairo-iso
          path: out

      - name: QEMU und UEFI-Firmware installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf

      # GitHub-VMs haben /dev/kvm, aber nur für root. So läuft die VM schnell.
      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Booten und Checkliste prüfen
        run: |
          flag=""
          [[ "${{ matrix.boot }}" == bios ]] && flag=--bios
          set +e
          scripts/boot-test.py $flag --out boot-test out/kairo-*-x86_64.iso
          rc=$?
          cat boot-test/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit $rc

      - name: Serielle Ausgabe anzeigen
        if: always()
        run: cat boot-test/serial.log || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: boot-test-${{ matrix.boot }}
          path: boot-test/
          retention-days: 14
