# Welches offizielle Archiso-Profil die Grundlage bildet.
# Wird von scripts/assemble-iso-profile.sh gelesen (Bash-Syntax).

# Name des Profils unter /usr/share/archiso/configs/
KAIRO_BASE_PROFILE="releng"

# archiso-Version, gegen die dieses Overlay geschrieben wurde.
# Quelle: https://github.com/archlinux/archiso (offizieller Spiegel), Tag v91.
# Weicht die installierte Version ab, warnt das Build-Skript.
KAIRO_ARCHISO_VERSION="91"
