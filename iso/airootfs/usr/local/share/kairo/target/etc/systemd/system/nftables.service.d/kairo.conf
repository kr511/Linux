# Archs nftables.service (1.1.7) ist Type=oneshot ohne RemainAfterExit: Nach dem
# Laden der Regeln steht der Dienst auf "inactive", obwohl die Firewall aktiv
# ist. Mit RemainAfterExit zeigt "systemctl status nftables" den echten Zustand,
# und "systemctl reload nftables" lädt /etc/nftables.conf neu.
[Service]
RemainAfterExit=yes
ExecReload=/usr/bin/nft -f /etc/nftables.conf
